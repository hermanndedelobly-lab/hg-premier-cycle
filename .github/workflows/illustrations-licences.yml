# Contrôle final des licences des photographies retenues, sur les fiches Wikimedia Commons originales.
# Déclenché uniquement quand illustrations/verification.json change sur la branche de développement.
# Ne télécharge aucune image et ne modifie pas l'application.
name: Illustrations — contrôle des licences

on:
  push:
    branches: [ccr-89031195-ic25pf]
    paths: [illustrations/verification.json]

permissions:
  contents: write

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier les licences sur Commons
        run: python3 outils/verifier-licences-illustrations.py
      - name: Déposer le résultat sur la branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add illustrations/selection/verification-licences.json
          if git diff --cached --quiet; then echo "Rien de nouveau."; exit 0; fi
          git commit -m "illustrations : contrôle des licences sur Commons (demande n° $(python3 -c "import json;print(json.load(open('illustrations/verification.json'))['numero'])"))"
          git push
