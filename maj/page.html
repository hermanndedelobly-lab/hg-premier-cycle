/* Mise en page : une colonne de lecture (≈ 46rem) sous une barre bleu nuit, aux couleurs du logo GNOMBLESSON
   (bleu nuit dominant, or en accent, filet orange-or-vert) ; l'orange marque l'histoire, le vert la géographie. */
:root {
  --bg: #f4f6fb;
  --surface: #ffffff;
  --ink: #0f1a33;
  --muted: #55607a;
  --line: #d8deeb;
  --brand: #002158;
  --brand-2: #003a80;
  --on-brand: #ffffff;
  --gold: #f8c215;
  --gold-2: #ffd84d;
  --orange: #f47b0b;
  --vert: #2aa63c;
  --on-gold: #1a1400;
  --hist: #b8540a;
  --hist-soft: #fdeedd;
  --geo: #0b7a3e;
  --geo-soft: #e1f3e8;
  --ok: #1f7a45;
  --focus: #f8c215;
  --font-ui: "Archivo", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-text: "Literata", Georgia, "Times New Roman", serif;
  --fs: 1;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #060f2b; --surface: #0c1a45; --ink: #e9edf8; --muted: #9aa6c4; --line: #1f2f63;
    --brand: #001438; --brand-2: #00296a; --on-brand: #ffffff;
    --hist: #ff9b4d; --hist-soft: #3a2412; --geo: #4fd08a; --geo-soft: #0f3324; --ok: #5fd08e; --focus: #ffc83d; --g-ligne: #8fa6e0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #060f2b; --surface: #0c1a45; --ink: #e9edf8; --muted: #9aa6c4; --line: #1f2f63;
  --brand: #001438; --brand-2: #00296a; --on-brand: #ffffff;
  --hist: #ff9b4d; --hist-soft: #3a2412; --geo: #4fd08a; --geo-soft: #0f3324; --ok: #5fd08e; --focus: #ffc83d; --g-ligne: #8fa6e0;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-ui); font-size: 15px; line-height: 1.45;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--brand); }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }
.gutter, .topbar-in, .classes, .vue, .bandeau-in {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- Barre supérieure ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: linear-gradient(180deg, var(--brand-2), var(--brand) 70%); color: var(--on-brand); }
.topbar::after { content: ""; display: block; height: 3px; background: linear-gradient(90deg, var(--orange) 0 18%, var(--gold) 18% 82%, var(--vert) 82% 100%); }
.topbar-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px 6px; max-width: 52rem; margin: 0 auto; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; min-width: 0; }
.brand-logo { width: 38px; height: 38px; border-radius: 9px; flex: none; display: block; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
.brand-text { display: flex; flex-direction: column; line-height: 1.1; min-width: 0; }
.brand-text b { font-weight: 800; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-text span { font-size: 11px; text-transform: uppercase; letter-spacing: .14em; opacity: .75; }
.tools { display: flex; gap: 4px; }
.tool { position: relative; display: grid; place-items: center; width: 42px; height: 42px; border-radius: 10px; }
.tool:hover { background: rgba(255,255,255,.08); }
.tool svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.dot { position: absolute; top: 8px; right: 8px; width: 9px; height: 9px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 2px var(--brand); }

.classes { display: flex; gap: 6px; max-width: 52rem; margin: 0 auto; padding-block: 4px 0; overflow-x: auto; scrollbar-width: none; }
.classes a {
  flex: 1 1 0; min-width: 64px; text-align: center; text-decoration: none; padding: 6px 4px 9px;
  border-bottom: 3px solid transparent; color: var(--on-brand); opacity: .72;
}
.classes a b { display: block; font-size: 19px; font-weight: 800; line-height: 1.1; }
.classes a span { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
.classes a[aria-current="page"] { opacity: 1; border-bottom-color: var(--gold); }

/* ---------- Vues ---------- */
.vue { max-width: 52rem; margin: 0 auto; padding-block: 20px 120px; outline: none; }
.chargement { color: var(--muted); }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0; }
h1, h2, h3 { text-wrap: balance; }
.titre-vue { font-size: clamp(26px, 6vw, 34px); font-weight: 800; line-height: 1.1; margin: 4px 0 6px; letter-spacing: -.01em; }
.chapo { color: var(--muted); margin: 0 0 18px; }

.reprendre { display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin: 0 0 22px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); text-decoration: none; }
.reprendre small { display: block; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.reprendre strong { display: block; }
.reprendre .fleche { margin-left: auto; font-size: 20px; color: var(--muted); }

.barre-progres { display: flex; align-items: center; gap: 10px; margin: 0 0 22px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.barre-progres .piste { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.barre-progres .piste i { display: block; height: 100%; background: var(--ok); }

.discipline { margin: 0 0 30px; }
.discipline-tete { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; border-bottom: 2px solid var(--c); padding-bottom: 6px; margin-bottom: 14px; }
.discipline-tete h2 { margin: 0; font-size: 22px; font-weight: 800; color: var(--c); }
.discipline-tete span { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.d-h { --c: var(--hist); --c-soft: var(--hist-soft); }
.d-g { --c: var(--geo); --c-soft: var(--geo-soft); }

.theme { margin: 0 0 18px; }
.theme-tete { margin: 0 0 8px; }
.theme-tete .eyebrow { color: var(--c); }
.theme-tete h3 { margin: 2px 0 0; font-size: 17px; font-weight: 700; line-height: 1.25; }
.lecons { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.lecons li + li { border-top: 1px solid var(--line); }
.lecons a { display: grid; grid-template-columns: 2.4rem 1fr auto; align-items: center; gap: 10px; padding: 12px 14px; text-decoration: none; min-height: 52px; }
.lecons a:hover { background: var(--c-soft); }
.lecons .num { font-weight: 800; color: var(--c); font-size: 14px; }
.lecons .t { min-width: 0; font-weight: 500; line-height: 1.3; }
.lecons .meta { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.coche { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line); font-size: 12px; color: transparent; }
.fait .coche { background: var(--ok); border-color: var(--ok); color: var(--bg); }

.liens-annexes { display: grid; gap: 8px; margin-top: 6px; }
.lien-carte { display: block; padding: 12px 14px; border-radius: 12px; border: 1px dashed var(--line); text-decoration: none; }
.lien-carte:hover { border-style: solid; }
.lien-carte small { display: block; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }

/* Accueil */
.accueil-grille { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin: 8px 0 26px; }
.carte-classe { display: flex; flex-direction: column; gap: 2px; padding: 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); text-decoration: none; }
.carte-classe b { font-size: 34px; font-weight: 800; line-height: 1; color: var(--brand); }
:root[data-theme="dark"] .carte-classe b { color: var(--on-brand); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .carte-classe b { color: var(--on-brand); } }
.carte-classe span { font-weight: 700; }
.carte-classe small { color: var(--muted); font-variant-numeric: tabular-nums; }
.carte-classe .mini { height: 4px; border-radius: 2px; background: var(--line); margin-top: 10px; overflow: hidden; }
.carte-classe .mini i { display: block; height: 100%; background: var(--ok); }

/* ---------- Leçon ---------- */
.fil { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); margin: 0 0 8px; }
.fil a { text-decoration: none; font-weight: 700; color: var(--c); }
.lecon-titre { font-size: clamp(24px, 5.4vw, 32px); font-weight: 800; line-height: 1.15; margin: 0 0 10px; letter-spacing: -.01em; }
.puces { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 16px; }
.puce { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 99px; background: var(--c-soft); color: var(--c); letter-spacing: .02em; }

.sommaire { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--hdr, 112px)); z-index: 5; display: flex; gap: 6px; margin: 0 -4px 18px; padding: 8px 4px; background: var(--bg); overflow-x: auto; scrollbar-width: none; }
.sommaire button { flex: none; font: inherit; font-size: 13px; font-weight: 700; padding: 8px 14px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.sommaire button:hover { border-color: var(--c); }

.bloc { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + var(--hdr, 112px) + 60px); margin: 0 0 28px; }
.bloc > h2 { font-size: 13px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--c); margin: 0 0 10px; display: flex; align-items: center; gap: 10px; }
.bloc > h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }

.texte { font-family: var(--font-text); font-size: calc(16.5px * var(--fs)); line-height: 1.65; max-width: 40rem; }
.texte p { margin: 0 0 .75em; }
.texte h3 { font-family: var(--font-ui); font-size: calc(17px * var(--fs)); font-weight: 800; margin: 1.3em 0 .4em; color: var(--ink); line-height: 1.3; }
.texte ul, .texte ol { margin: 0 0 .9em; padding-left: 1.3em; }
.texte li { margin: 0 0 .3em; }
.texte li::marker { color: var(--c); }
.texte strong { font-weight: 700; }
.texte a { color: var(--c); text-underline-offset: 2px; word-break: break-word; }
.texte blockquote { margin: 0 0 1em; padding: .2em 0 .2em 1em; border-left: 3px solid var(--c); color: var(--muted); }
.tbl { overflow-x: auto; margin: 0 0 1.1em; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.tbl table { border-collapse: collapse; width: 100%; font-family: var(--font-ui); font-size: calc(14px * var(--fs)); line-height: 1.4; }
.tbl th, .tbl td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.tbl th { background: var(--c-soft, var(--line)); font-weight: 700; white-space: nowrap; }
.tbl tr:last-child td { border-bottom: 0; }

.situation { background: var(--c-soft); border-radius: 12px; padding: 14px 16px 6px; max-width: 40rem; }
.situation .texte { font-size: calc(15.5px * var(--fs)); }

.outils-exo { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 12px; }
.exo { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px 12px; margin: 0 0 12px; max-width: 40rem; }
.exo .enonce > :last-child { margin-bottom: .4em; }
.corrige { border-top: 1px dashed var(--line); margin-top: 8px; padding-top: 6px; }
.corrige summary { cursor: pointer; font-family: var(--font-ui); font-weight: 700; font-size: 14px; color: var(--ok); list-style: none; display: inline-flex; align-items: center; gap: 6px; padding: 6px 0; }
.corrige summary::-webkit-details-marker { display: none; }
.corrige summary::before { content: "▸"; transition: transform .15s; }
.corrige[open] summary::before { transform: rotate(90deg); }
.corrige-body { padding: 4px 0 2px; }

.btn { font: inherit; font-size: 14px; font-weight: 700; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover { border-color: var(--muted); }
.btn-plein { background: linear-gradient(180deg, var(--gold-2), var(--gold)); border-color: var(--gold); color: var(--on-gold); }
.btn[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--bg); }

.suivants { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 30px; }
.suivants a { display: block; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); text-decoration: none; min-width: 0; }
.suivants small { display: block; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.suivants span { display: block; font-weight: 700; line-height: 1.25; }
.suivants .apres { text-align: right; grid-column: 2; }

/* ---------- Recherche ---------- */
.champ { width: 100%; font: inherit; font-size: 17px; padding: 13px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); }
.champ:focus { outline: none; border-color: var(--focus); }
.filtres { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 16px; }
.filtres button { font: inherit; font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.filtres button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.resultats { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.resultats a { display: block; padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); text-decoration: none; }
.resultats .r-meta { font-size: 12px; color: var(--c); font-weight: 700; letter-spacing: .04em; }
.resultats .r-titre { font-weight: 700; display: block; margin: 2px 0 4px; }
.resultats .r-extrait { font-family: var(--font-text); font-size: 14px; color: var(--muted); }
mark { background: #ffe08a; color: #1a1400; border-radius: 3px; padding: 0 2px; }
.vide { color: var(--muted); }

/* ---------- Réglages ---------- */
.reglages { display: grid; gap: 14px; }
.panneau { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.panneau h2 { margin: 0 0 8px; font-size: 17px; font-weight: 800; }
.panneau p { margin: 0 0 10px; }
.panneau p:last-child { margin-bottom: 0; }
.ligne { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.etat { font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: var(--line); }
.etat.ok { background: var(--ok); color: var(--bg); }
.notes { margin: 6px 0 0; padding-left: 1.2em; }
.notes li { margin-bottom: 4px; }
.version-num { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 22px; }
.msg { font-size: 14px; color: var(--muted); min-height: 1.4em; }
.etapes { margin: 0; padding-left: 1.2em; }
.etapes li { margin-bottom: 4px; }

/* ---------- Bandeau de mise à jour ---------- */
.bandeau { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--brand); color: var(--on-brand); padding-bottom: env(safe-area-inset-bottom, 0px); box-shadow: 0 -6px 24px rgba(0,0,0,.18); }
.bandeau-in { max-width: 52rem; margin: 0 auto; padding-block: 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.bandeau p { margin: 0; flex: 1 1 16rem; }
.bandeau-btns { display: flex; gap: 8px; }
.bandeau .btn:not(.btn-plein) { background: transparent; color: var(--on-brand); border-color: rgba(255,255,255,.3); }

@media (max-width: 420px) {
  .brand-text b { font-size: 14px; }
  .lecons a { grid-template-columns: 2rem 1fr auto; padding: 11px 12px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

/* Intertitres du cours : I. (h4) et 1. (h5) */
.texte h4 { font-family: var(--font-ui); font-size: calc(17px * var(--fs)); font-weight: 800; letter-spacing: .01em; color: var(--c); margin: 1.5em 0 .5em; padding-bottom: 4px; border-bottom: 1px solid var(--line); line-height: 1.3; }
.texte h5 { font-family: var(--font-ui); font-size: calc(16px * var(--fs)); font-weight: 700; color: var(--ink); margin: 1.1em 0 .35em; line-height: 1.3; }
.situation .tbl { margin-top: .4em; }

/* Onglets Cours / Exercices / Schémas d'une classe */
.onglets-classe { display: flex; gap: 4px; padding: 4px; margin: 4px 0 18px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.onglets-classe a { flex: 1; text-align: center; text-decoration: none; font-weight: 700; font-size: 14px; padding: 9px 6px; border-radius: 9px; color: var(--muted); }
.onglets-classe a span { display: inline-block; min-width: 1.6em; padding: 0 5px; margin-left: 2px; border-radius: 99px; font-size: 11px; background: var(--line); color: var(--ink); font-variant-numeric: tabular-nums; }
.onglets-classe a[aria-current="page"] { background: var(--brand); color: var(--on-brand); }
.onglets-classe a[aria-current="page"] span { background: var(--gold); color: var(--on-gold); }
.chip-lien { flex: none; font-size: 13px; font-weight: 700; padding: 8px 14px; border-radius: 99px; border: 1px solid var(--c); color: var(--c); text-decoration: none; white-space: nowrap; }
.puce-lien { text-decoration: none; border: 1px solid var(--c); background: transparent; }

/* Activité d'application à la fin d'une partie */
.appli { margin: 14px 0 22px; padding: 12px 14px 8px; border-radius: 12px; border: 1.5px dashed var(--c); background: var(--surface); font-size: calc(15.5px * var(--fs)); }
.appli-tete { font-family: var(--font-ui); font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--c); margin: 0 0 6px !important; }
.appli .enonce > :last-child { margin-bottom: .3em; }

/* Schémas */
details.schema { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); margin: 0 0 10px; }
details.schema > summary { cursor: pointer; list-style: none; display: flex; gap: 12px; align-items: center; padding: 12px 14px; font-weight: 700; }
details.schema > summary::-webkit-details-marker { display: none; }
details.schema > summary b { display: block; }
details.schema > summary small { display: block; font-weight: 500; color: var(--muted); font-size: 12.5px; }
details.schema[open] > summary { border-bottom: 1px solid var(--line); }
details.schema > .texte { padding: 12px 14px 4px; }
.sch-num { flex: none; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: var(--c-soft, var(--line)); color: var(--c, var(--ink)); font-weight: 800; }
figure.graphe { margin: 6px 0 16px; padding: 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); overflow-x: auto; }
figure.graphe svg { display: block; width: 100%; min-width: 540px; height: auto; font-family: var(--font-ui); }
figure.graphe figcaption { font-family: var(--font-ui); font-size: 12.5px; color: var(--muted); text-align: center; padding-top: 6px; }
.g-mm { stroke: #d68034; stroke-opacity: .12; stroke-width: .6; }
.g-cm { stroke-opacity: .28; stroke-width: .9; }
.g-axe { stroke: var(--ink); stroke-width: 1.6; }
.g-fleche { fill: var(--ink); }
.g-rappel { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
.g-point { fill: var(--hist); }
.g-txt { fill: var(--ink); font-size: 13px; }
.g-petit { fill: var(--ink); font-size: 11px; }
.g-pluie { fill: var(--geo); } .g-temp { fill: var(--hist); }
.g-barre-pluie, .g-barre { fill: var(--geo); fill-opacity: .75; }
.g-courbe-temp, .g-courbe { fill: none; stroke: var(--hist); stroke-width: 2.4; }
.g-point-temp { fill: var(--hist); }
.g-h { fill: var(--geo); fill-opacity: .8; } .g-f { fill: var(--hist); fill-opacity: .8; }
.g-boite { fill: var(--surface); stroke: var(--g-ligne, var(--brand)); stroke-width: 1.6; }
.g-periode, .g-part { stroke: var(--bg); stroke-width: 1; }
.p0 { fill: var(--geo); } .p1 { fill: var(--hist); } .p2 { fill: #d6a234; } .p3 { fill: #6c8f4e; } .p4 { fill: #8a6bb0; } .p5 { fill: #9aa4a0; }
.g-periode { fill-opacity: .55; }

/* ---------- Export PDF ---------- */
.btn-pdf { display: inline-flex; align-items: center; gap: 6px; margin: 4px 0 12px; }
.panneau-pdf { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
.pp-fond { position: absolute; inset: 0; background: rgba(10, 16, 14, .45); }
.pp-boite { position: relative; width: min(520px, 100%); background: var(--surface); color: var(--ink); border-radius: 16px 16px 0 0;
  padding: 16px max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  box-shadow: 0 -8px 30px rgba(0,0,0,.2); font-family: var(--font-ui); }
.pp-tete { display: flex; justify-content: space-between; align-items: center; font-size: 1.05rem; }
.pp-x { border: 0; background: none; font-size: 1.6rem; line-height: 1; color: var(--muted); cursor: pointer; padding: 0 4px; }
.pp-titre { margin: 4px 0 10px; color: var(--muted); font-size: .9rem; }
.pp-case { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; font-size: .95rem; }
.pp-case input { width: 18px; height: 18px; accent-color: var(--brand); }
.pp-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pp-actions .btn { justify-content: center; text-align: center; }
.pp-note { margin: 10px 0 0; font-size: .8rem; color: var(--muted); }
.pp-msg { margin: 6px 0 0; font-size: .9rem; min-height: 1.2em; }
.panneau-pdf.occupe .pp-actions { opacity: .5; pointer-events: none; }
@media (min-width: 700px) { .panneau-pdf { align-items: center; } .pp-boite { border-radius: 16px; } }

/* ---------- Bandeau d'accueil (logo) ---------- */
.hero { display: flex; align-items: center; gap: 16px; margin: 14px 0 18px; padding: 14px; border-radius: 18px;
  background: linear-gradient(135deg, var(--brand-2), var(--brand)); color: var(--on-brand); border: 2px solid var(--gold); }
.hero img { width: 104px; height: 104px; border-radius: 20px; flex: none; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
.hero div { min-width: 0; }
.hero b { display: block; font-size: 1.15rem; font-weight: 800; letter-spacing: .01em; }
.hero b em { font-style: normal; color: var(--gold-2); }
.hero p { margin: 6px 0 0; font-size: .9rem; font-style: italic; opacity: .92; line-height: 1.35; }
.hero small { display: inline-block; margin-top: 8px; padding: 2px 10px; border-radius: 999px; background: var(--gold); color: var(--on-gold); font-weight: 800; font-size: .75rem; letter-spacing: .06em; }
@media (max-width: 380px) { .hero img { width: 84px; height: 84px; } }

/* ---------- Quiz (1.11.0) ---------- */
:root { --ko: #b3261e; --ko-soft: #fbe9e7; --ok-soft: #e3f4ea; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ko: #ff8f85; --ko-soft: #3a1513; --ok-soft: #0f3324; } }
:root[data-theme="dark"] { --ko: #ff8f85; --ko-soft: #3a1513; --ok-soft: #0f3324; }
.onglets-classe a { min-width: 0; }
@media (max-width: 400px) { .onglets-classe a { font-size: 13px; padding: 9px 2px; } .onglets-classe a span { display: none; } }
.carte-quiz { display: flex; align-items: center; gap: 12px; padding: 14px; margin: 0 0 22px; border-radius: 14px; background: var(--surface); border: 2px solid var(--gold); text-decoration: none; }
.carte-quiz:hover { background: var(--c-soft, var(--surface)); }
.carte-quiz small { display: block; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.carte-quiz strong { display: block; line-height: 1.25; }
.carte-quiz .cq-score { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
.carte-quiz .fleche { margin-left: auto; font-size: 20px; color: var(--muted); }
.cq-icone { flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--gold); color: var(--on-gold); font-weight: 800; font-size: 20px; }
.note-quiz { font-weight: 800; color: var(--c); }
.lecons li.fait .note-quiz { color: var(--ok); }
.quiz-progres { display: flex; align-items: center; gap: 10px; margin: 4px 0 14px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.quiz-progres .piste { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.quiz-progres .piste i { display: block; height: 100%; background: var(--gold); transition: width .3s; }
.quiz-source { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 0 0 6px; }
.quiz-question { font-family: var(--font-text); font-size: calc(19px * var(--fs)); font-weight: 700; line-height: 1.35; margin: 0 0 16px; }
.quiz-question:focus { outline: none; }
.quiz-choix { list-style: none; margin: 0 0 16px; padding: 0; display: grid; gap: 10px; }
.quiz-choix button { width: 100%; display: flex; align-items: flex-start; gap: 12px; text-align: left; font: inherit; font-size: calc(15px * var(--fs)); line-height: 1.35; padding: 12px 14px; min-height: 52px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.quiz-choix button:not(:disabled):hover { border-color: var(--c); }
.quiz-choix button:disabled { cursor: default; opacity: .62; }
.quiz-choix .lettre { flex: none; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--c-soft); color: var(--c); font-weight: 800; font-size: 13px; }
.quiz-choix button.juste { opacity: 1; border-color: var(--ok); background: var(--ok-soft); }
.quiz-choix button.juste .lettre { background: var(--ok); color: var(--bg); }
.quiz-choix button.faux { opacity: 1; border-color: var(--ko); background: var(--ko-soft); }
.quiz-choix button.faux .lettre { background: var(--ko); color: var(--bg); }
.quiz-retour { display: grid; gap: 12px; justify-items: start; padding-bottom: 24px; }
.quiz-retour:empty { display: none; }
.quiz-verdict { width: 100%; padding: 12px 14px; border-radius: 12px; border-left: 5px solid; background: var(--surface); }
.quiz-verdict.ok { border-color: var(--ok); }
.quiz-verdict.ok strong { color: var(--ok); }
.quiz-verdict.ko { border-color: var(--ko); }
.quiz-verdict.ko strong { color: var(--ko); }
.quiz-verdict p { margin: 6px 0 0; }
.quiz-fin { text-align: center; padding: 20px 14px; margin: 8px 0 26px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.quiz-note { margin: 4px 0; font-size: 22px; color: var(--muted); font-variant-numeric: tabular-nums; }
.quiz-note b { font-size: 56px; line-height: 1; color: var(--ink); }
.quiz-mention { font-weight: 800; font-size: 18px; margin: 0 0 6px; }
.quiz-actions { justify-content: center; margin-top: 14px; }
.quiz-erreurs { margin: 0; padding-left: 1.3em; display: grid; gap: 12px; }
.quiz-erreurs li p { margin: 0 0 4px; }
.quiz-erreurs .rep b { color: var(--ok); }

/* ---------- Espaces de la leçon, cahier des charges V1.1 (1.12.0) ---------- */
.espaces { margin: 2px 0 10px; }
.statut-v11 { margin: 0 0 12px; font-size: 13px; color: var(--muted); font-style: italic; }
.v11 { font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 99px; background: var(--gold); color: var(--on-gold); }
.badge { display: inline-block; vertical-align: middle; font-family: var(--font-ui); font-size: 11px; font-weight: 800; letter-spacing: .04em; padding: 2px 8px; border-radius: 99px; background: var(--line); color: var(--ink); text-transform: none; }
.badge.prog { background: var(--ok); color: var(--bg); }
.badge.approf { background: var(--gold); color: var(--on-gold); }
.legende-badges, .chapo-bloc { font-family: var(--font-ui); font-size: 14px; color: var(--muted); }
.texte .transition { font-style: italic; color: var(--muted); border-left: 3px solid var(--c); padding-left: 10px; }
.texte .illus-expl { font-size: calc(14.5px * var(--fs)); color: var(--muted); margin-top: -6px; }
.texte .conseil { background: var(--c-soft); border-radius: 10px; padding: 10px 12px; font-size: calc(14.5px * var(--fs)); }
figure.graphe.illus svg { min-width: 0; max-width: 420px; margin: 0 auto; }
.retenir { margin: 18px 0 22px; padding: 12px 14px 4px; border-radius: 12px; background: var(--c-soft); border: 2px solid var(--c); }
.texte blockquote { margin: 0 0 1em; padding: 10px 14px; border-left: 4px solid var(--c); background: var(--surface); border-radius: 0 10px 10px 0; font-style: italic; }
.texte blockquote p { margin: 0; }
.faq dt { font-family: var(--font-ui); font-weight: 800; margin: 14px 0 4px; }
.faq dd { margin: 0 0 6px; padding-left: 12px; border-left: 2px solid var(--line); }
.texte .exo ol, .texte > ol { padding-left: 1.4em; }

/* ---------- Photographies des leçons enrichies (1.13.0) ---------- */
figure.photo { margin: 8px 0 14px; padding: 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
figure.photo img { display: block; width: auto; max-width: 100%; height: auto; max-height: 340px; margin: 0 auto; border-radius: 6px; background: var(--line); }
figure.photo figcaption { font-family: var(--font-ui); font-size: calc(13px * var(--fs)); color: var(--muted); padding-top: 8px; line-height: 1.4; }
figure.photo figcaption b { color: var(--ink); }
figure.photo .credit { display: block; margin-top: 4px; font-size: calc(11.5px * var(--fs)); opacity: .9; }
.tbl.credits table { font-size: calc(12px * var(--fs)); }
.tbl.credits td { overflow-wrap: anywhere; }

/* ---------- Identité GNOMBLESSON (1.14.0) ---------- */
.brand-text b { letter-spacing: .06em; }
.brand-text span { text-transform: none; letter-spacing: .02em; opacity: .85; }
.hero img { border-radius: 22px; }
.hero b { font-size: 1.3rem; letter-spacing: .05em; }
.hero-sous { display: block; margin-top: 2px; color: var(--gold-2); font-weight: 800; font-size: .82rem; letter-spacing: .08em; text-transform: uppercase; }
.demarrage { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 24px;
  background: radial-gradient(circle at 50% 42%, #003070, #002158 62%, #001438); transition: opacity .4s ease; }
.demarrage img { width: min(62vw, 300px); height: auto; border-radius: 15%; box-shadow: 0 10px 40px rgba(0,0,0,.45); }
.demarrage.fin { opacity: 0; pointer-events: none; }
@media (prefers-reduced-motion: reduce) { .demarrage { transition: none; } }

/* Espace enseignant de la classe : cinq onglets sur petit écran (largeur selon le libellé) */
@media (max-width: 440px) { .onglets-classe { gap: 2px; } .onglets-classe a { flex: 1 1 auto; padding: 9px 3px; } }

/* Cartes et schémas des leçons enrichies (fonds de carte Natural Earth, domaine public) */
.g-mer { fill: #2f7fbf; fill-opacity: .14; }
.g-pays { fill: var(--surface); stroke: var(--muted); stroke-width: .7; stroke-linejoin: round; }
.g-pays-ci { fill: var(--geo); fill-opacity: .16; stroke: var(--geo); stroke-width: 1.4; stroke-linejoin: round; }
.g-fleuve { fill: none; stroke: #2f7fbf; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.g-zone { fill-opacity: .35; stroke: none; }

<script>/* GNOMBLESSON — stockage v2 des mises à jour sans APK (depuis 1.17.0).
   Le contenu complet téléchargé est compressé (gzip) puis « emballé » en texte (15 bits par caractère, caractères
   U+0800 à U+87FF, jamais de demi-caractère UTF-16) et rangé dans localStorage sous la clé hg1c.contenu-gz :
   environ 6 fois moins de place qu'avant. La clé hg1c.contenu-maj ne contient plus qu'un petit descripteur
   (ou, pour la passerelle 1.10.0, un squelette porteur du lanceur). Une empreinte (FNV-1a) contrôle l'intégrité.
   Les clés de progression (faites, quiz, derniere, reglages…) ne sont jamais lues ni modifiées ici.
   Ce fichier est inclus tel quel dans la page de mise à jour (outils/fichier-unique.py, mode maj) et dans le
   lanceur de la passerelle (outils/fabriquer-pont.py). */
window.HGStock = window.HGStock || (function () {
  'use strict';
  var CLE = 'hg1c.contenu-gz', CLE_TMP = 'hg1c.contenu-gz-nouveau', ENTETE = 'GZ15';
  function dispo() { return typeof CompressionStream === 'function' && typeof DecompressionStream === 'function' && typeof TextEncoder === 'function'; }
  function empreinte(s) { var h = 0x811c9dc5; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return ('0000000' + h.toString(16)).slice(-8); }
  function flux(octets, transfo) { return new Response(new Blob([octets]).stream().pipeThrough(transfo)).arrayBuffer().then(function (b) { return new Uint8Array(b); }); }
  function emballer(o) {   // octets → texte, 15 bits par caractère
    var t = [], acc = 0, n = 0;
    for (var i = 0; i < o.length; i++) {
      acc = (acc << 8) | o[i]; n += 8;
      if (n >= 15) { n -= 15; t.push(String.fromCharCode(0x0800 + ((acc >>> n) & 0x7fff))); acc &= (1 << n) - 1; }
      if (t.length >= 8192) { t = [t.join('')]; }
    }
    if (n > 0) t.push(String.fromCharCode(0x0800 + ((acc << (15 - n)) & 0x7fff)));
    return t.join('');
  }
  function deballer(s, longueur) {
    var o = new Uint8Array(longueur), acc = 0, n = 0, j = 0;
    for (var i = 0; i < s.length && j < longueur; i++) {
      var v = s.charCodeAt(i) - 0x0800; if (v < 0 || v > 0x7fff) throw new Error('caractère invalide');
      acc = (acc << 15) | v; n += 15;
      while (n >= 8 && j < longueur) { n -= 8; o[j++] = (acc >>> n) & 0xff; acc &= (1 << n) - 1; }
    }
    if (j !== longueur) throw new Error('données tronquées');
    return o;
  }
  // texte JSON → valeur à ranger : « GZ15:version:longueur:empreinte:données »
  function compresser(version, texte) {
    return flux(new TextEncoder().encode(texte), new CompressionStream('gzip')).then(function (o) {
      return [ENTETE, version, o.length, empreinte(texte), emballer(o)].join(':');
    });
  }
  function lireEntete(val) {
    if (!val || val.slice(0, 5) !== ENTETE + ':') return null;
    var p = val.split(':', 4), deb = p.join(':').length + 1;
    return { version: p[1], longueur: +p[2], empreinte: p[3], donnees: val.slice(deb) };
  }
  // valeur rangée → texte JSON vérifié
  function decompresser(val, versionAttendue) {
    var e = lireEntete(val);
    if (!e) return Promise.reject(new Error('stockage compressé absent'));
    if (versionAttendue && e.version !== versionAttendue) return Promise.reject(new Error('version ' + e.version + ' au lieu de ' + versionAttendue));
    var o; try { o = deballer(e.donnees, e.longueur); } catch (x) { return Promise.reject(x); }
    return flux(o, new DecompressionStream('gzip')).then(function (b) {
      var t = new TextDecoder().decode(b);
      if (empreinte(t) !== e.empreinte) throw new Error('empreinte incorrecte');
      return t;
    });
  }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { /* rien */ } }
  // contenu enregistré (version) → objet ; rejeté si absent, d'une autre version ou abîmé
  function lire(version) { return decompresser(lsGet(CLE), version).then(JSON.parse); }
  function versionRangee() { var e = lireEntete(lsGet(CLE)); return e ? e.version : null; }
  // squelette pour la passerelle 1.10.0 : structure complète, textes longs vidés, champs déclencheurs conservés
  function squelette(d) {
    function vide(x, cle) {
      if (typeof x === 'string') return (x.length > 300 && cle !== 'pont' && x.indexOf('pont-declencheur') < 0) ? '' : x;
      if (Array.isArray(x)) return cle === 'quiz' ? [] : x.map(function (y) { return vide(y, ''); });
      if (x && typeof x === 'object') { var r = {}; Object.keys(x).forEach(function (k) { r[k] = vide(x[k], k); }); return r; }
      return x;
    }
    var s = vide(d, ''); s.stub = true; s.stockage = 'compresse'; return s;
  }
  function descripteur(d) { return { version: d.version, date: d.date, stockage: 'compresse', notes: (d.notes || []).slice(0, 1) }; }
  /* Enregistre une version complète (objet d, texte JSON t) : contenu compressé vérifié, puis page de code éventuelle,
     puis descripteur (dernier, c'est lui qui « valide » la mise à jour). stub : squelette passerelle à garder.
     En cas d'échec, l'état précédent est conservé (ou, au pire, l'application revient à la version de l'APK). */
  function enregistrer(d, t, page, stub) {
    if (!dispo()) return Promise.reject(new Error('compression indisponible'));
    var V = d.version;
    return compresser(V, t).then(function (val) {
      // ancien contenu non compressé (format 1, plusieurs Mo) : remplacé d'abord par un descripteur provisoire
      // (version « 0 » : l'APK démarre sur sa propre version tant que la nouvelle n'est pas complète)
      var ancienDesc = lsGet('hg1c.contenu-maj');
      if (ancienDesc && ancienDesc.length > 200000) lsSet('hg1c.contenu-maj', JSON.stringify({ version: '0', stockage: 'en-cours' }));
      if (!lsSet(CLE_TMP, val)) {   // place insuffisante : on libère l'ancien contenu compressé avant de réessayer
        lsDel(CLE_TMP); lsDel(CLE);
        if (!lsSet(CLE_TMP, val)) { lsDel(CLE_TMP); throw new Error('place insuffisante'); }
      }
      return decompresser(lsGet(CLE_TMP), V).then(function (t2) {
        if (t2 !== t) throw new Error('relecture différente');
        if (page !== null && page !== undefined && !lsSet('hg1c.code-maj', JSON.stringify({ version: V, page: page }))) throw new Error('place insuffisante (code)');
        lsDel(CLE);
        if (!lsSet(CLE, val)) throw new Error('place insuffisante (contenu)');
        lsDel(CLE_TMP);
        if (!lsSet('hg1c.contenu-maj', JSON.stringify(stub || descripteur(d)))) throw new Error('place insuffisante (descripteur)');
        return true;
      });
    }).catch(function (e) { lsDel(CLE_TMP); throw e; });
  }
  function oublier() { lsDel(CLE); lsDel(CLE_TMP); }
  return { dispo: dispo, compresser: compresser, decompresser: decompresser, lire: lire, versionRangee: versionRangee,
    enregistrer: enregistrer, squelette: squelette, descripteur: descripteur, empreinte: empreinte, oublier: oublier,
    emballer: emballer, deballer: deballer, CLE: CLE };
})();
</script>

<script>/* GNOMBLESSON · Histoire & Géographie (ex-« Histoire géographie premier cycle ») — application hors ligne */
(function () {
  'use strict';
  if (window.HG_REMPLACER) return;   // une version téléchargée plus récente va remplacer cette page (voir le script de démarrage)
  var MODE = window.HG_MODE || 'single';
  var VERSION = window.HG_VERSION || '?';
  var D = null;                 // contenu
  var INDEX = {};               // id -> {type, classe, disc, theme, lecon|annexe}
  var ORDRE = {}, ORDRE_X = {};               // classe -> [ids des leçons dans l'ordre]
  var RECH = [];                // index de recherche
  var FICHE_ENS = {};           // id de leçon -> id de la fiche de préparation (espace enseignant de la classe)
  var vue = document.getElementById('vue');
  var swReg = null, majEnAttente = null, majDemandee = false;

  // ---------- Stockage local (protégé) ----------
  function lire(k, def) { try { var v = localStorage.getItem('hg1c.' + k); return v === null ? def : JSON.parse(v); } catch (e) { return def; } }
  function ecrire(k, v) { try { localStorage.setItem('hg1c.' + k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  function effacer(k) { try { localStorage.removeItem('hg1c.' + k); } catch (e) { /* rien */ } }
  function plusRecent(a, b) {
    var x = String(a || '0').split('.').map(Number), y = String(b || '0').split('.').map(Number);
    for (var i = 0; i < 3; i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); }
    return false;
  }
  var VERSION_ORIGINE = window.HG_VERSION_EMBARQUEE || (window.HG_DATA ? window.HG_DATA.version : null);
  // Canal des mises à jour de l'application Android (contenu et code) : branche de développement (test).
  // À remplacer par l'adresse du site publié lorsque la publication sera autorisée.
  var ADRESSE_MAJ = 'https://raw.githubusercontent.com/hermanndedelobly-lab/hg-premier-cycle/gnomblesson-integration';
  var faites = lire('faites', {});
  var scores = lire('quiz', {});    // id (leçon ou classe) -> {m: meilleur score, n: nb de questions, d: date, k: essais}
  var reglages = lire('reglages', { theme: 'auto', taille: 1, corriges: false });

  function appliquerReglages() {
    var r = document.documentElement;
    if (reglages.theme === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', reglages.theme);
    r.style.setProperty('--fs', reglages.taille);
  }
  appliquerReglages();

  // ---------- Outils ----------
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function norm(s) { return s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
  function nbLecons(c) { return ORDRE[c.id].length; }
  function nbFaites(c) { return ORDRE[c.id].filter(function (id) { return faites[id]; }).length; }
  function nomTheme(t) { return t.n ? 'Thème ' + t.n : 'Complément'; }

  function chercher() {
    var res = document.getElementById('res'); if (!res) return;
    var mots = norm(rechEtat.q).split(/\s+/).filter(function (m) { return m.length > 1; });
    if (!mots.length) { res.innerHTML = '<li class="vide">Tape au moins un mot de deux lettres. La recherche porte sur les titres, les cours, les exercices et les annexes des quatre classes.</li>'; return; }
    var trouves = [];
    RECH.forEach(function (r) {
      if (rechEtat.classe && r.classe !== rechEtat.classe) return;
      var score = 0;
      for (var i = 0; i < mots.length; i++) {
        var inT = r.t.indexOf(mots[i]) >= 0, inX = r.nx.indexOf(mots[i]) >= 0;
        if (!inT && !inX) return;
        score += inT ? 10 : 1;
      }
      trouves.push({ r: r, s: score });
    });
    trouves.sort(function (a, b) { return b.s - a.s; });
    if (!trouves.length) { res.innerHTML = '<li class="vide">Aucun résultat pour « ' + esc(rechEtat.q) + ' ». Essaie un autre mot ou retire le filtre de classe.</li>'; return; }
    res.innerHTML = trouves.slice(0, 60).map(function (o) {
      var r = o.r, p = r.nx.indexOf(mots[0]), deb = Math.max(0, p - 70);
      var ext = (deb > 0 ? '… ' : '') + r.x.slice(deb, deb + 190) + ' …';
      return '<li class="d-' + (r.disc || 'h') + '"><a href="' + r.href + '"><span class="r-meta">' + esc(r.ctx) + '</span><span class="r-titre">' + surligner(r.titre, mots) + '</span><span class="r-extrait">' + surligner(ext, mots) + '</span></a></li>';
    }).join('') + (trouves.length > 60 ? '<li class="vide">' + (trouves.length - 60) + ' autres résultats : précise ta recherche.</li>' : '');
  }
  function surligner(txt, mots) {
    // surlignage insensible aux accents : on travaille sur la version normalisée (même longueur caractère par caractère)
    var n = norm(txt), marques = [];
    mots.forEach(function (m) { var i = 0; while ((i = n.indexOf(m, i)) >= 0) { marques.push([i, i + m.length]); i += m.length; } });
    if (n.length !== txt.length || !marques.length) return esc(txt);
    marques.sort(function (a, b) { return a[0] - b[0]; });
    var out = '', pos = 0;
    marques.forEach(function (mk) { if (mk[0] < pos) return; out += esc(txt.slice(pos, mk[0])) + '<mark>' + esc(txt.slice(mk[0], mk[1])) + '</mark>'; pos = mk[1]; });
    return out + esc(txt.slice(pos));
  }

  window.HGPDF = { ouvrir: ouvrir, _fabriquer: fabriquer, _document: documentPdf, _charger: charger, _nom: nomFichier };
})();
</script>
